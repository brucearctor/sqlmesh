services:
  fe-01:
    image: apache/doris:fe-4.0.8
    container_name: doris-fe-01
    hostname: fe-01
    environment:
      - FE_SERVERS=fe1:172.30.80.2:9010
      - FE_ID=1
    ports:
      - "8030:8030"
      - "9030:9030"
    volumes:
      - iceberg-warehouse:/tmp/doris_iceberg_warehouse
    networks:
      doris_net:
        ipv4_address: 172.30.80.2

  be-01:
    image: apache/doris:be-4.0.8
    container_name: doris-be-01
    hostname: be-01
    depends_on:
      - fe-01
    environment:
      - FE_SERVERS=fe1:172.30.80.2:9010
      - BE_ADDR=172.30.80.3:9050
    ports:
      - "8040:8040"
      - "9050:9050"
    volumes:
      - iceberg-warehouse:/tmp/doris_iceberg_warehouse
    networks:
      doris_net:
        ipv4_address: 172.30.80.3

volumes:
  iceberg-warehouse:

networks:
  doris_net:
    ipam:
      config:
        - subnet: 172.30.80.0/24
